<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sarcry</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
overflow:hidden;
font-family:'Orbitron', sans-serif;
}

/* fundo */

.background{
position:fixed;
width:100%;
height:100%;
background: radial-gradient(circle at center,#1a001f,#000000 70%);
z-index:-1;
}

/* estrelas */

.star{
position:absolute;
width:4px;
height:4px;
background:#b44cff;
border-radius:50%;
box-shadow:0 0 6px #b44cff;
animation:fall linear infinite;
opacity:0.8;
}

@keyframes fall{
0%{transform:translateY(-100px);opacity:0;}
20%{opacity:1;}
100%{transform:translateY(110vh);opacity:0;}
}

/* card */

.card{
position:absolute;
top:50%;
left:50%;
width:720px;
height:420px;
border-radius:30px;
background:rgba(15,0,25,0.55);
backdrop-filter:blur(25px);
border:1px solid rgba(180,76,255,0.35);
box-shadow:0 0 40px rgba(180,76,255,0.35),
inset 0 0 30px rgba(180,76,255,0.15);
transform:translate(-50%,-50%);
overflow:hidden;
}

/* titulo */

.title{
position:absolute;
top:15px;
left:50%;
transform:translateX(-50%);
text-align:center;
}

.title h1{
font-size:50px;
color:white;
text-shadow:0 0 20px #9333ea;
}

.title p{
font-size:28px;
color:#c77dff;
}

/* logos */

.logo-left{
position:absolute;
top:18px;
left:22px;
color:#c26bff;
font-size:22px;
font-weight:700;
}

.logo-right{
position:absolute;
top:18px;
right:22px;
color:#c26bff;
font-size:18px;
font-weight:700;
}

/* HOME */

#home{
position:absolute;
top:55%;
left:50%;
transform:translate(-50%,-50%);
}

.boxes{
display:flex;
gap:70px;
}

.box{
width:180px;
height:240px;
border-radius:22px;
background:rgba(15,0,25,0.55);
border:1px solid rgba(180,76,255,0.35);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
transition:0.3s;
}

.box:hover{
transform:scale(1.08);
box-shadow:0 0 30px #b44cff;
}

/* criatura */

.creature{
width:110px;
height:110px;
fill:#b44cff;
animation:float 3s ease-in-out infinite;
}

@keyframes float{
0%{transform:translateY(0px);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0px);}
}

/* segunda pagina */

#shop{
display:none;
width:100%;
height:100%;
align-items:center;
justify-content:center;
}

.products{
display:flex;
gap:25px;
}

.product{
width:190px;
height:240px;
border-radius:18px;
overflow:hidden;
border:1px solid #b44cff;
box-shadow:0 0 20px rgba(180,76,255,0.3);
transition:0.3s;
}

.product img{
width:100%;
height:100%;
object-fit:cover;
}

.product:hover{
transform:scale(1.05);
box-shadow:0 0 30px #b44cff;
}

</style>
</head>

<body>

<div class="background" id="stars"></div>

<div class="card">

<div class="logo-left" id="logoLeft">Sarcry</div>
<div class="logo-right" id="logoRight">artenez by it7</div>

<div class="title" id="title">
<h1>Bienvenido</h1>
<p>la_sarcry</p>
</div>

<!-- PAGINA INICIAL -->

<div id="home">

<div class="boxes">

<div class="box" onclick="openShop()">

<svg class="creature" viewBox="0 0 100 100">
<path d="M50 10
C40 20 35 35 45 45
C30 45 25 60 40 65
C25 70 30 85 50 80
C70 85 75 70 60 65
C75 60 70 45 55 45
C65 35 60 20 50 10Z"/>
</svg>

</div>

<div class="box" onclick="openShop()">

<svg class="creature" viewBox="0 0 100 100">
<path d="M20 70
C40 20 70 20 80 50
C85 65 75 80 60 75
C55 90 35 90 40 70
Z"/>
</svg>

</div>

</div>

</div>

<!-- SEGUNDA PAGINA -->

<div id="shop">

<div class="products">

<div class="product">
<img src="foto1.jpg">
</div>

<div class="product">
<img src="foto2.jpg">
</div>

<div class="product">
<img src="foto3.jpg">
</div>

</div>

</div>

</div>

<script>

const starsContainer = document.getElementById("stars")

for(let i=0;i<80;i++){

let star = document.createElement("div")

star.classList.add("star")

star.style.left = Math.random()*100 + "%"
star.style.animationDuration = (3 + Math.random()*5) + "s"
star.style.animationDelay = Math.random()*5 + "s"

starsContainer.appendChild(star)

}

function openShop(){

document.getElementById("home").style.display="none"
document.getElementById("shop").style.display="flex"

document.getElementById("title").style.display="none"
document.getElementById("logoLeft").style.display="none"
document.getElementById("logoRight").style.display="none"

}

</script>

</body>
</html>
